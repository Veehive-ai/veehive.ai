<!doctype html>
<meta charset="utf-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#0E1117;
       font-family:'IBM Plex Sans',system-ui,sans-serif;color:#EEF0F5;position:relative}

  /* the mark, bled off the right, exactly as it sits on the card */
  .ground{position:absolute;right:-150px;top:-120px;height:860px;opacity:.07}

  .wrap{position:absolute;inset:0;padding:66px 72px;display:flex;flex-direction:column}
  .logo{height:46px;width:auto;display:block;align-self:flex-start}

  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:88px;letter-spacing:-.03em;
     line-height:1;margin-top:auto}
  .lede{font-size:21px;color:#A7AEBE;margin-top:20px;max-width:30ch;line-height:1.45}

  .marks{display:flex;gap:16px;align-items:center;margin-top:38px}
  .marks img{width:40px;height:40px}

  .foot{display:flex;align-items:center;gap:14px;margin-top:40px;
        font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.14em;
        text-transform:uppercase;color:#6F7788}
  .pink{width:9px;height:9px;border-radius:50%;background:#EC4899;flex:none}
</style>

<img class="ground" src="veehive-mark.svg" alt="">
<div class="wrap">
  <img class="logo" src="veehive-ai-logo-white.svg" alt="Veehive.ai">
  <h1>Brand kit</h1>
  <p class="lede">The mark, the logotype, the palette and the two typefaces &mdash; with the rules that keep them consistent.</p>
  <div class="marks">
    <img src="favicon-mpliphi.svg" alt="">
    <img src="favicon-snapapro.svg" alt="">
    <img src="favicon-hivestudio.svg" alt="">
    <img src="favicon-hivelink.svg" alt="">
    <img src="favicon-hivemind.svg" alt="">
    <img src="favicon-hivedocs.svg" alt="">
    <img src="favicon-hivefront.svg" alt="">
  </div>
  <div class="foot"><span class="pink"></span>veehive.ai/brand</div>
</div>
