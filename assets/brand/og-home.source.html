<!doctype html>
<meta charset="utf-8">
<title>og home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#0E1117;
       font-family:'IBM Plex Sans',system-ui,sans-serif;color:#EEF0F5;position:relative}

  .ground{position:absolute;right:-170px;top:-130px;height:900px;opacity:.07}

  .wrap{position:absolute;inset:0;padding:60px 68px 54px;display:flex;flex-direction:column}
  .logo{height:42px;width:auto;align-self:flex-start}

  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:60px;letter-spacing:-.03em;
     line-height:1.08;margin-top:auto;white-space:nowrap}
  h1 .grad{background:linear-gradient(90deg,#6B82FF 0%,#3B5BFF 45%,#8B5CFF 100%);
           -webkit-background-clip:text;background-clip:text;color:transparent}

  .apps{display:flex;gap:26px;margin-top:34px}
  .app{display:flex;flex-direction:column;align-items:center;gap:9px;width:84px}
  .app img{width:34px;height:34px}
  .app span{font-size:12.5px;color:#A7AEBE;white-space:nowrap}

  .foot{display:flex;align-items:center;gap:16px;margin-top:auto;padding-top:30px;
        font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;
        text-transform:uppercase;color:#6F7788}
  .foot .dot{width:8px;height:8px;border-radius:50%;background:#EC4899;flex:none}
  .foot .sep{color:#39414F}
</style>

<img class="ground" src="veehive-mark.svg" alt="">
<div class="wrap">
  <img class="logo" src="veehive-ai-logo-white.svg" alt="Veehive.ai">

  <h1>Power your business<br><span class="grad">with bespoke agentic apps.</span></h1>

  <div class="apps">
    <div class="app"><img src="favicon-mpliphi.svg" alt=""><span>Mpliphi</span></div>
    <div class="app"><img src="favicon-snapapro.svg" alt=""><span>SnapaPro</span></div>
    <div class="app"><img src="favicon-hivestudio.svg" alt=""><span>HiveStudio</span></div>
    <div class="app"><img src="favicon-hivelink.svg" alt=""><span>HiveLink</span></div>
    <div class="app"><img src="favicon-hivemind.svg" alt=""><span>HiveMind</span></div>
    <div class="app"><img src="favicon-hivedocs.svg" alt=""><span>HiveDocs</span></div>
    <div class="app"><img src="favicon-hivefront.svg" alt=""><span>HiveFront</span></div>
  </div>

  <div class="foot">
    <span class="dot"></span>veehive.ai
    <span class="sep">/</span>Six agentic apps. One harness.
    <span class="sep">/</span>Dubai AI Seal Tier E
  </div>
</div>
