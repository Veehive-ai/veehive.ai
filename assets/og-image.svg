  <text x="600" y="595" text-anchor="middle" font-family="-apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6671" letter-spacing="3">VEEHIVE.AI</text>
