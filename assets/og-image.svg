  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="430" y="92" width="340" height="36" rx="18" fill="rgba(139,92,255,0.12)" stroke="rgba(139,92,255,0.35)" stroke-width="1"/>
