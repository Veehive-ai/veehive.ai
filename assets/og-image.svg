  <text x="475" y="115" font-family="-apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#C9B8FF" letter-spacing="1.5">DUBAI AI SEAL TIER E CERTIFIED</text>

  <text x="600" y="270" text-anchor="middle" font-family="-apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Applied AI</text>
  <text x="600" y="368" text-anchor="middle" font-family="-apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="url(#accent)" letter-spacing="-2">from Dubai.</text>

  <text x="600" y="430" text-anchor="middle" font-family="-apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#9AA5B1" letter-spacing="0">Four AI products. One company.</text>

