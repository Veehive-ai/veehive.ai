<style>
    *{box-sizing:border-box;}
    body{
        margin:0; min-height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; text-align:center; padding:40px 24px;
        background:var(--vh-color-bg); color:var(--vh-color-text);
        font-family:var(--vh-font-sans); line-height:1.6; -webkit-font-smoothing:antialiased;
    }
    html.light body{background:#fff;}
    a{color:inherit; text-decoration:none;}
    :focus-visible{outline:2px solid var(--vh-color-brand); outline-offset:3px; border-radius:4px;}
    .logo img{height:26px; width:auto;}
    .logo-white{display:inline-block; opacity:.9;}
    .logo-color{display:none;}
    html.light .logo-white{display:none;}
    html.light .logo-color{display:inline-block;}
    .code{
        margin:44px 0 0; font-size:13px; font-weight:700; letter-spacing:.2em;
        text-transform:uppercase; color:var(--vh-color-brand);
    }
    h1{
        margin:14px 0 0; font-size:clamp(2rem,5vw,3rem); font-weight:800;
        letter-spacing:-.03em; line-height:1.1;
    }
    p{margin:18px 0 0; color:var(--vh-color-text-muted); max-width:44ch; font-size:16px;}
    .links{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:32px;}
    .links a{
        padding:11px 20px; border-radius:999px; font-size:14px; font-weight:600;
        border:1px solid var(--vh-color-border-hover); transition:border-color .18s ease, transform .18s ease;
    }
    .links a:hover{border-color:var(--vh-color-brand); transform:translateY(-1px);}
    .links a.primary{background:var(--vh-color-brand); border-color:var(--vh-color-brand); color:#fff;}
    @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>
    <a class="logo" href="/" aria-label="Veehive.ai home">
        <img src="/logo-veehive-white-192.png" alt="Veehive" class="logo-white">

        <a href="/about.html">About</a>

<script>
    (function(){
        try{
            var saved = localStorage.getItem('veehive-theme');
            if (saved !== 'dark') document.documentElement.classList.add('light');
        }catch(e){ document.documentElement.classList.add('light'); }
    })();
</script>
</body>
