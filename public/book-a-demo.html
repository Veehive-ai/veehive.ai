<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VVGKWGPNGY"></script>
    <script>

    var _vhSaved=(function(){try{return localStorage.getItem('veehive-consent')}catch(e){return null}})();

      ad_storage: _vhSaved==='granted' ? 'granted' : 'denied',
      ad_user_data: _vhSaved==='granted' ? 'granted' : 'denied',
      ad_personalization: _vhSaved==='granted' ? 'granted' : 'denied',
      analytics_storage: _vhSaved==='granted' ? 'granted' : 'denied',
      wait_for_update: 500
    });

    gtag('config','G-VVGKWGPNGY',{anonymize_ip:true});

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F1A20">
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <title>Book a Demo — Veehive.ai</title>
    <meta name="description" content="Tell us a bit about your business and we'll be in touch to schedule your Veehive demo.">
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F1A20;
            --panel: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.10);
            --text: #F4F6F8;
            --text-dim: rgba(244,246,248,0.65);
            --accent: #3B5BFF;
            --accent-dark: #2A45CC;
            --accent-tint: rgba(59,91,255,0.12);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #F7F8FA;
                --panel: #FFFFFF;
                --border: rgba(15,26,32,0.10);
                --text: #0F1A20;
                --text-dim: rgba(15,26,32,0.65);
                --accent: #3B5BFF;
                --accent-dark: #2A45CC;
                --accent-tint: rgba(59,91,255,0.08);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        h1, h2 { font-family: 'Manrope', system-ui, sans-serif; }
        .card {
            width: 100%;
            max-width: 480px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
        }
        .logo { display: block; margin-bottom: 24px; height: 28px; }
        .logo-dark { display: none; }
        @media (prefers-color-scheme: dark) {
            .logo-light { display: none; }
            .logo-dark { display: block; }
        }
        h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
        .sub { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
        input, textarea {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            margin-bottom: 18px;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { resize: vertical; min-height: 90px; }
        .honey { position: absolute; left: -9999px; top: -9999px; }
        button[type="submit"] {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: var(--accent-dark); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { font-size: 13px; margin-top: 14px; display: none; line-height: 1.5; }
        .msg.error { color: #ff6b6b; }
        .msg.error a { color: inherit; }
        #success { display: none; text-align: center; }
        #success h2 { font-size: 20px; margin: 0 0 8px; }
        #success p { color: var(--text-dim); font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <form id="demo-form">
            <img src="/logo-veehive-ai-46h.png" alt="Veehive" class="logo logo-light">
            <img src="/logo-veehive-ai-white-46h.png" alt="Veehive" class="logo logo-dark">
            <h1>Book a demo</h1>
            <p class="sub">Tell us a bit about your business and we'll be in touch to schedule your Veehive demo.</p>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="company">Company</label>
            <input type="text" id="company" name="company" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">What are you hoping to solve?</label>
            <textarea id="message" name="message"></textarea>

            <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off">
            <input type="hidden" name="product" value="veehive">

            <button type="submit" id="submit-btn">Request demo</button>
            <p class="msg error" id="error-msg"></p>
        </form>
        <div id="success">
            <h2>Thanks — request received</h2>
            <p>We'll be in touch shortly to schedule your demo.</p>
        </div>
    </div>
    <script>
    document.getElementById('demo-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var form = e.target;
        var btn = document.getElementById('submit-btn');
        var errorMsg = document.getElementById('error-msg');
        errorMsg.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Sending…';

        var payload = {
            name: form.name.value,
            company: form.company.value,
            email: form.email.value,
            message: form.message.value,
            _honey: form._honey.value,
            product: form.product.value,
        };

        try {
            var res = await fetch('https://mpliphi-api-835361883890.me-central1.run.app/api/demo-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (!res.ok) throw new Error('Request failed');
            form.style.display = 'none';
            document.getElementById('success').style.display = 'block';
            if (window.gtag) gtag('event', 'generate_lead', { link_text: 'Request demo', page_location: window.location.pathname });
        } catch (err) {
            errorMsg.innerHTML = 'Something went wrong. Please email us at <a href="mailto:sathish@veehive.ai">sathish@veehive.ai</a> and we\'ll get back to you.';
            errorMsg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Request demo';
        }
    });
    </script>
</body>
</html>
