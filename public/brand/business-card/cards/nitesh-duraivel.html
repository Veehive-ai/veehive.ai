<!doctype html>
<html><head><meta charset="utf-8">
<title>Veehive Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 3.5 x 2 in at 300 dpi = 1050 x 600 */
  :root{--ink:#33373D;--muted:#6B7280;--line:#E5E7EB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9E6E1;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);padding:60px;display:flex;flex-direction:column;gap:60px;align-items:center}
  .card{width:1050px;height:600px;background:#FCFCFD;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px rgba(40,44,50,.25)}
  h1,h2,.prod span{font-family:'Manrope',sans-serif}

  /* FRONT */
  .front .logo{position:absolute;left:70px;top:76px;height:56px}
  .front .bigmark{position:absolute;right:-219px;top:-171px;height:942px;opacity:.075}
  .front .bee{position:absolute;right:56px;top:44px;width:176px;height:176px}
  .front h1{position:absolute;left:68px;top:222px;font-size:52px;font-weight:800;letter-spacing:-.02em}
  .front .role{position:absolute;left:70px;top:294px;font-size:30px;color:var(--muted);font-weight:400}
  .front .rule{position:absolute;left:68px;top:352px;width:64px;height:3px;background:var(--line);border-radius:2px}
  .front ul{position:absolute;left:68px;top:374px;list-style:none;display:flex;flex-direction:column;gap:12px}
  .front li{display:flex;align-items:center;gap:22px;font-size:25px;font-weight:400}
  .front li svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .front .seal{position:absolute;right:58px;bottom:56px;width:146px;height:146px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:4px;box-shadow:0 6px 16px -8px rgba(40,44,50,.25)}
  .front .seal img{width:100%;height:100%;border-radius:10px;display:block}

  /* BACK */
  .back{display:flex;flex-direction:column;align-items:center;padding-top:68px}
  .back .url{position:absolute;right:56px;top:46px;font-size:21px;letter-spacing:.18em;color:var(--muted)}
  .back h2{font-size:54px;font-weight:800;letter-spacing:-.02em}
  .back h2 em{font-style:normal}
  .back .sub{margin-top:8px;font-size:24px;color:var(--muted);letter-spacing:.04em}
  .grid{margin-top:104px;display:grid;grid-template-columns:repeat(7,1fr);column-gap:12px;width:930px}
  .prod{display:flex;flex-direction:column;align-items:center;gap:13px}
  .tile{width:94px;height:94px;display:grid;place-items:center}
  /* HiveFront is the harness, so it sits in the middle and sits larger */
  .prod:nth-child(4) .tile img{width:92px;height:92px}
  .tile img{width:74px;height:74px}
  .prod span{font-size:21px;font-weight:700;white-space:nowrap}
  .tag{position:absolute;bottom:40px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;font-size:16px;letter-spacing:.3em;color:var(--muted);font-weight:500}
  .tag::before,.tag::after{content:"";width:48px;height:1px;background:#C9CCD3}
  /* export mode: card.html?front or ?back renders one side at 1050x600 */
  body.solo{padding:0;gap:0;background:#FCFCFD}
  body.solo .card{border-radius:0;box-shadow:none}
  /* print: one card per page at 3.5 x 2 in (1050 px layout scaled to 336 px) */
  @page{size:3.5in 2in;margin:0}
  @media print{
    body{padding:0;gap:0;background:none;display:block}
    .card{zoom:.32;border-radius:0;box-shadow:none;break-after:page}
  }
</style></head>
<body>

<section class="card front" id="front">
  <img class="bigmark" src="mark-veehive.svg" alt="">
  <img class="bee" src="bee-hivefront.png" alt="">
  <img class="logo" src="logo-veehive-gray.svg" alt="Veehive">
  <h1>Nitesh Duraivel</h1>
  <div class="role">AI/LLM Engineer</div>
  <div class="rule"></div>
  <ul>
    <li><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>nitesh@veehive.ai</li>
    <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>veehive.ai</li>
    <li><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Dubai, UAE</li>
  </ul>
  <div class="seal"><img src="dubai-ai-seal.png" alt="Dubai AI Seal - Tier E Certified"></div>
</section>

<section class="card back" id="back">
  <div class="url">veehive.ai</div>
  <h2>Agentic Apps</h2>
  <div class="sub">Six agentic apps. One harness.</div>
  <div class="grid">
    <div class="prod"><div class="tile" style="--t:#E9F0EC"><img src="icon-mpliphi.svg" alt=""></div><span>Mpliphi</span></div>
    <div class="prod"><div class="tile" style="--t:#FDECEC"><img src="icon-snapapro.svg" alt=""></div><span>SnapaPro</span></div>
    <div class="prod"><div class="tile" style="--t:#FFF3E3"><img src="icon-mind.svg" alt=""></div><span>HiveMind</span></div>
    <div class="prod"><div class="tile" style="--t:#FDEAF3"><img src="icon-hivefront.svg" alt=""></div><span>HiveFront</span></div>
    <div class="prod"><div class="tile" style="--t:#F1EBFD"><img src="icon-studio.svg" alt=""></div><span>HiveStudio</span></div>
    <div class="prod"><div class="tile" style="--t:#EAF0FD"><img src="icon-hivelink.svg" alt=""></div><span>HiveLink</span></div>
    <div class="prod"><div class="tile" style="--t:#E3F4F2"><img src="icon-hivedocs.svg" alt=""></div><span>HiveDocs</span></div>
  </div>
  <div class="tag">POWER YOUR BUSINESS WITH BESPOKE AGENTIC APPS.</div>
</section>

<script>
  const side = location.search.slice(1);
  if (side === 'front' || side === 'back') {
    document.body.classList.add('solo');
    document.getElementById(side === 'front' ? 'back' : 'front').remove();
  }
</script>
</body></html>
